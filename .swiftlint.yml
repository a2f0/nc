# SwiftLint (pinned in .mise.toml), run with --strict by `bun run lint:swift`, so every
# warning fails the check. Layout belongs to SwiftFormat (.swiftformat).
included:
  - ios
excluded:
  # Generated by `bun run l10n`.
  - ios/Shared/AppLanguage.swift
reporter: xcode

disabled_rules:
  # SwiftFormat adds trailing commas to every multiline list.
  - trailing_comma

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - balanced_xctest_lifecycle
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - no_empty_block
  - non_overridable_class_declaration
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - superfluous_else
  - test_case_accessibility
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

line_length:
  warning: 120
  ignores_urls: true

identifier_name:
  excluded:
    - id
    # Conventional signal processing names: Paul Kellet's pink noise filter state, a
    # white noise sample, a filter's Q and frequency, and a polynomial's x.
    - b0
    - b1
    - b2
    - b3
    - b4
    - b5
    - b6
    - w
    - q
    - hz
    - x
