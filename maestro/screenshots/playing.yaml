# Store screenshot: pink noise playing.
appId: net.a2f0.nc
tags:
  - screenshots
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Noise Connoisseur"
    timeout: 30000
# iOS exposes the card as "Play Pink Noise"; Android as its title and blurb.
- tapOn: ".*Pink Noise.*"
- extendedWaitUntil:
    visible: "Stop Pink Noise"
    timeout: 10000
