# Run on dedicated test devices. Also verifies persistence across a normal relaunch.
appId: net.a2f0.nc
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Noise Connoisseur"
    timeout: 30000
- tapOn:
    id: "playback"
- assertVisible: "Stop White Noise"
- tapOn: "More"
- assertNotVisible: "Playback log"
- tapOn: "Settings"
- assertVisible: "Language"
- assertVisible: "Appearance"
- tapOn: "Playback log"
- assertNotVisible: "Appearance"
- extendedWaitUntil:
    visible: "(?s).*Playback started.*"
    timeout: 10000
- tapOn: "General"
- assertVisible: "Appearance"
- assertNotVisible: "Share log"
- tapOn: "Playback log"
- assertVisible: "Share log"
- tapOn: "Close"
- tapOn:
    id: "playback"
- tapOn: "More"
- assertNotVisible: "Playback log"
- tapOn: "Settings"
- assertVisible: "Language"
- assertVisible: "Appearance"
- tapOn: "Playback log"
- assertNotVisible: "Appearance"
- assertVisible: "(?s).*Playback stopped.*"
- assertNotVisible: "Some playback events could not be loaded or saved."
- assertVisible: "Share log"
- tapOn: "Close"
- launchApp:
    stopApp: true
- tapOn: "More"
- assertNotVisible: "Playback log"
- tapOn: "Settings"
- assertVisible: "Language"
- assertVisible: "Appearance"
- tapOn: "Playback log"
- assertNotVisible: "Appearance"
- assertVisible: "(?s).*Playback stopped.*"
- assertNotVisible: "(?s).*Previous playback has no recorded stop.*"
