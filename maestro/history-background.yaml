# Android: exercise a live history sheet through Home/foreground transitions.
# Run against the minified release on a dedicated emulator/device.
appId: net.a2f0.nc
---
- launchApp:
    clearState: true
    stopApp: true
- tapOn: ".*White Noise.*"
- tapOn: "More"
- tapOn: "Listening history"
- tapOn: "All time"
- repeat:
    times: 4
    commands:
      - pressKey: Home
      - launchApp:
          stopApp: false
      - assertVisible: "Listening history"
      - assertNotVisible: "Previous week"
- extendedWaitUntil:
    visible: "White Noise: (0\\.[1-9]|[1-9][0-9]*(\\.[0-9])?) min"
    timeout: 35000
- tapOn: "Calendar"
- tapOn: "Previous week"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "No listening recorded for these dates."
- tapOn: "Today"
- assertVisible: "White Noise: (0\\.[1-9]|[1-9][0-9]*(\\.[0-9])?) min"
- tapOn: "Close"
- tapOn:
    id: "playback"
- assertVisible: "Play White Noise"
