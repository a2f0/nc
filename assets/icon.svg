<?xml version="1.0" encoding="UTF-8"?>
<!-- App mark: an LCD equalizer, five columns of segments rising from the bottom edge.
     Full-bleed: scripts/buildImages.sh draws it over the whole icon, so the columns touch
     the icon's bottom edge. Grayscale, like the rest of the app: lit segments are gray,
     light gray from row 6, and white from row 9 (counting from the bottom). The dim, unlit
     segments in the "unlit" group are left out of the single-color icons (notification and
     themed), the favicon, and the logo beside each app's title, so keep that group's id, and
     its closing tag on its own line. -->
