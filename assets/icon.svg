<?xml version="1.0" encoding="UTF-8"?>
<!-- App mark: an LCD equalizer, five columns of segments rising from the bottom edge.
     Full-bleed: scripts/buildImages.sh draws it over the whole icon, so the columns touch
     the icon's bottom edge. Lit segments are green, amber at row 6, red at row 9 (counting
     from the bottom). The dim, unlit segments in the "unlit" group are left out of the
     single-color icons (notification and themed) and the favicon, so keep that group's
     id, and its closing tag on its own line. -->
