name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ShellCheck
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: shellcheck
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for binary files
        run: sh scripts/checks/checkBinaryFiles.sh --all

      - name: Lint shell scripts
        run: sh scripts/checks/lintScripts.sh

      - name: Check agent skills
        run: bun run agents:check

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin

      - name: Set up Java and Gradle
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: java gradle
          cache: true

      - name: Build and lint
        run: |
          sh scripts/ensureGradleWrapper.sh
          cd android
          ./gradlew --no-daemon assembleDebug lintDebug

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ImageMagick
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install imagemagick

      - name: Build for the simulator
        run: |
          xcodebuild \
            -quiet \
            -project ios/NoiseConnoisseur.xcodeproj \
            -scheme NoiseConnoisseur \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # The single required check (see agent-tool.json).
  gate:
    name: CI gate
    if: always()
    needs: [lint, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "Not every job succeeded: $RESULTS"
              exit 1
            fi
          done
