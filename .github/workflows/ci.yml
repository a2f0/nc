name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and ShellCheck
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun shellcheck
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for binary files
        run: sh scripts/checks/checkBinaryFiles.sh --all

      - name: Lint shell scripts
        run: sh scripts/checks/lintScripts.sh

      - name: Lint Ruby
        run: bundle exec rubocop

      - name: Check agent skills
        run: bun run agents:check

      - name: Check localization
        run: bun run l10n:check

      - name: Install web integration test browser
        run: bun x --no-install playwright install --with-deps chromium

      - name: Test fastlane helpers, web, and localization
        run: bun run test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle build renders its images with agent-tool (scripts/build/buildImages.sh).
      - name: Set up Bun, Java, and Gradle
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun java gradle
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and lint
        run: |
          sh scripts/dev/ensureGradleWrapper.sh
          cd android
          ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Xcode build renders its images with agent-tool (scripts/build/buildImages.sh).
      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for the simulator
        run: |
          xcodebuild \
            -quiet \
            -project ios/NoiseConnoisseur.xcodeproj \
            -scheme NoiseConnoisseur \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test audio rendering
        run: sh scripts/testing/testIosAudio.sh

      - name: Test playback lifecycle
        run: sh scripts/testing/testIosPlayback.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run web:check

      - name: Build
        run: bun run web:build

      - name: Check deploy config
        run: bunx --no-install wrangler deploy --config web/wrangler.jsonc --dry-run

  # The single required check (see agent-tool.json).
  gate:
    name: CI gate
    if: always()
    needs: [lint, android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "Not every job succeeded: $RESULTS"
              exit 1
            fi
          done
