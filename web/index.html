<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="White, pink, and brown noise, a fan, and ocean waves, generated in real time." />
    <title>Noise Connoisseur</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <h1 class="app-title"><img class="logo" src="icon.svg" alt="" />Noise Connoisseur</h1>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="sounds" class="sounds"></div>
      <footer class="footer"><a id="support" href="support">Support</a> · <a id="privacy" href="privacy">Privacy policy</a></footer>
    </main>
    <div class="player">
      <div class="controls">
        <button id="playback" type="button" class="toggle" aria-label="Play White Noise"></button>
        <div class="volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9v6h4l5 5V4l-5 5H7z" /></svg>
          <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
